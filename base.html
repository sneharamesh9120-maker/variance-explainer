<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Variance Explainer{% endblock %}</title>
  <style>
{% include "style.css" %}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Variance Explainer</a>
    <nav>
      <a href="{{ url_for('index') }}">New report</a>
      <a href="{{ url_for('history') }}">Past reports</a>
      <a href="{{ url_for('admin_dashboard') }}">Admin</a>
    </nav>
  </header>
  <main class="wrap">
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<div class="notice">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">Prototype. Figures are calculated by rules; the AI only writes the explanation.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
